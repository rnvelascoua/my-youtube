spring.application.name=song
# ==========================================
# DATASOURCE CONFIGURATION
# ==========================================
# Replace "localhost:5432" with your host/port and "your_database_name" with your DB name
spring.datasource.url=jdbc:postgresql://localhost:5432/db_song
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Automatically updates the database schema based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Optimizes the SQL generation specifically for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prints executed SQL queries to the console log (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true